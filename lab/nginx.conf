worker_processes 1;
daemon off;
pid /tmp/php2shell-lab/nginx.pid;
error_log /tmp/php2shell-lab/nginx-error.log warn;
events { worker_connections 256; }
http {
  client_max_body_size 200m;
  access_log /tmp/php2shell-lab/access.log;
  fastcgi_read_timeout 60;
  server {
    listen 127.0.0.1:8081;
    root /tmp/php2shell-lab/www;
    index index.php;
    location / { try_files $uri $uri/ /index.php$is_args$args; }
    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9000;
      include /nix/store/d56vz94spzlixbsgyvxqgavmi3s0ig6f-nginx-1.28.3/conf/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
  }
}
