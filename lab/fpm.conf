[global]
pid = /tmp/php2shell-lab/fpm.pid
error_log = /tmp/php2shell-lab/fpm-error.log
daemonize = no
[www]
listen = 127.0.0.1:9000
pm = static
pm.max_children = 4
catch_workers_output = yes
rlimit_core = unlimited
php_admin_value[session.save_path] = /tmp/php2shell-lab/sess
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 100M
php_admin_value[max_file_uploads] = 20
php_admin_value[session.upload_progress.enabled] = On
php_admin_value[session.upload_progress.cleanup] = Off
php_admin_value[error_log] = /tmp/php2shell-lab/php-error.log
php_admin_value[log_errors] = On
php_admin_flag[display_errors] = Off
